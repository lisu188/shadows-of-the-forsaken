name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    name: Documentation tests (not Unity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
      - name: Test documentation and level design contract
        env:
          PYTHONUTF8: '1'
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate level design graph (not Unity)
        run: python3 tools/validate_level_contract.py
      - name: Export design text
        run: |
          mkdir -p artifacts
          python3 tools/export_design.py > artifacts/design-text.md
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: design-text
          path: artifacts/design-text.md
          if-no-files-found: error
          retention-days: 14
