name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Export design document for review
        run: |
          mkdir -p artifacts
          python3 tools/export_design.py > artifacts/design-text.md
          cp 'Shadows of the Forsaken.docx' artifacts/
      - name: Validate project structure
        if: ${{ hashFiles('tools/validate_project.py') != '' }}
        run: python3 tools/validate_project.py
      - name: Run headless gameplay tests
        if: ${{ hashFiles('tests/Headless/Headless.csproj') != '' }}
        run: dotnet run --project tests/Headless/Headless.csproj --configuration Release
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation
          path: artifacts/
          if-no-files-found: warn
