name: Movement C# tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: movement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  movement:
    name: C# movement (not Unity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile production motor and run shared tests
        run: dotnet test tests/Movement/Movement.Tests.csproj --configuration Release --logger 'trx;LogFileName=movement.trx' --results-directory artifacts/movement
      - name: Require executed movement and frame-rate tests
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('artifacts/movement/movement.trx').getroot()
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          counts = root.find('.//t:Counters', ns)
          assert counts is not None, 'Missing counters'
          total = int(counts.attrib['total'])
          assert total >= 35, 'Movement tests not discovered'
          assert int(counts.attrib['executed']) == int(counts.attrib['passed']) == total
          assert int(counts.attrib['failed']) == 0
          results = root.findall('.//t:UnitTestResult', ns)
          assert len(results) == total and all(r.get('outcome') == 'Passed' for r in results)
          for method in ('BallisticMotionIsFrameRateIndependent', 'MovingWhileTurningFollowsTheSameArcAtEveryFrameRate', 'TerminalVelocityIntegrationIsFrameRateIndependent'):
              for fps in (30, 60, 120):
                  assert any(r.get('testName') == f'{method}({fps})' for r in results), (method, fps)
          print('Verified executed C# movement tests:', total)
          PY
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movement-test-results
          path: artifacts/movement/
          if-no-files-found: error
          retention-days: 14
